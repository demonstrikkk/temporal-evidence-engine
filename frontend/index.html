<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Temporal Evidence Engine — claim-level verification</title>
    <meta
      name="description"
      content="Paste an AI-generated answer and the time it was produced. Get atomic claims, live research, exact quotes from stored sources, and a deterministic verdict for each claim."
    />
    <meta name="theme-color" content="#f6f3ee" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" type="image/svg+xml" href="/tee.svg" />
    <meta property="og:title" content="Temporal Evidence Engine" />
    <meta
      property="og:description"
      content="A claim is supported, changed, contradicted or unverifiable — with the exact source text and the event date that decided it."
    />
    <meta property="og:image" content="/tee.svg" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />

    <style>
      /* The first frame is paper, not white. The boot mark is plain CSS so it
         cannot depend on an asset that the bundle has not requested yet. */
      html { background: #f6f3ee; }
      #root { min-height: 100%; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        transition: opacity 260ms ease;
      }
      #boot span {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        border: 1px solid #d3cabb;
        background: #fbf9f6;
        color: #9a6b3f;
        font: 24px/1 'Instrument Serif', Georgia, serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true"><span>⏱</span></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
